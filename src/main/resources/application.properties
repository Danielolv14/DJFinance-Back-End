# ── Banco de dados ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/druds_db
spring.datasource.username=postgres
spring.datasource.password=1402
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# update: cria/atualiza as tabelas automaticamente (ideal para desenvolvimento)
# create-drop: recria tudo ao iniciar e apaga ao encerrar (ideal para testes)
# validate: apenas valida sem alterar (ideal para produção)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Servidor ─────────────────────────────────────────────────────────────────
server.port=8080

# ── Google Calendar ───────────────────────────────────────────────────────────
# Sincroniza cada show cadastrado/editado/apagado com o Google Agenda do DJ.
# Fica DESLIGADO enquanto as variáveis abaixo não forem definidas no ambiente.
google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
# Conteúdo do arquivo JSON da conta de serviço (definir como variável de ambiente)
google.calendar.credentials-json=${GOOGLE_CREDENTIALS_JSON:}
# ID da agenda de cada DJ (ex: xxxx@group.calendar.google.com)
google.calendar.druds=${GOOGLE_CALENDAR_DRUDS:}
google.calendar.braichi=${GOOGLE_CALENDAR_BRAICHI:}
